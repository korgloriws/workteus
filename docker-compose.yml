services:
  workteus:
    build: .
    ports:
      - "4030:4030"
    environment:
      PORT: 4030
      HOSTNAME: 0.0.0.0
      AUTH_SECRET: ${AUTH_SECRET:?defina AUTH_SECRET no .env}
      ADMIN_USER: ${ADMIN_USER:?defina ADMIN_USER no .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD no .env}
      DATABASE_PATH: /app/data/workteus.db
    volumes:
      - workteus_data:/app/data
    restart: unless-stopped

volumes:
  workteus_data:
